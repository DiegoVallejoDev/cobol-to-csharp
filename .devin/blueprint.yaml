# https://docs.devin.ai/onboard-devin/environment-yaml
# Toolchain for the COBOL->C# pilot: GnuCOBOL (goldens) + .NET 8 (ports/tests).
initialize: |
  sudo apt-get update -qq && sudo apt-get install -y -qq gnucobol3
  curl -LsSf https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
  bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
  echo "PATH=$HOME/.dotnet:$PATH" >> $ENVRC
  mkdir -p /tmp/cob /tmp/vsam
maintenance: |
  $HOME/.dotnet/dotnet restore CobolModernization.sln
knowledge:
  - name: test
    contents: |
      # Shared gate: instructions/skills in AGENTS.md and .agents/skills/.
      # Never regenerates tracked goldens.
      export PATH="$HOME/.dotnet:$PATH"
      bash tools/verify.sh
  - name: build
    contents: |
      # $HOME/.dotnet/dotnet build
  - name: run
    contents: |
      # Disposable flat records, not GnuCOBOL's indexed database files.
      data_dir="$(mktemp -d)"
      python3 tests/parity/stage.py mainframe/data "$data_dir"
      $HOME/.dotnet/dotnet run --project src/CardDemo.Batch -- CBACT04C 2022071800 "$data_dir"
